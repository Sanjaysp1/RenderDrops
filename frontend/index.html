<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenderDrops // Core System</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
            },
            colors: {
              brand: {
                red: '#FF0033',
                dark: '#020202',
              }
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        background-color: #020202;
        color: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
        overflow-x: hidden;
      }
      body::-webkit-scrollbar {
        display: none;
      }
      .tech-border {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(2, 2, 2, 0.6);
        backdrop-filter: blur(12px);
      }
      .tech-glow {
        box-shadow: 0 0 20px rgba(255, 0, 51, 0.15);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #FF0033;
      }
    </style>

      </head>
  <body class="bg-brand-dark text-white antialiased selection:bg-brand-red selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.js"></script></body>
</html>
